<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Roamgate Desktop</title>
<style>
body{margin:0;background:#101216;color:#eceef2;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:560px;padding:48px}h1{font-size:30px;letter-spacing:-1px}p{color:#b0b6c2;line-height:1.6;white-space:pre-wrap}small{color:#7e8797}button{background:#272e3a;color:#fff;border:1px solid #424e62;border-radius:8px;padding:10px 18px;margin:16px 10px 0 0;cursor:pointer}button:hover{background:#354155}.mark{color:#b3d7b1;letter-spacing:3px;font-size:12px}#detail{font-size:13px;max-height:220px;overflow:auto}
</style>
</head>
<body><main class="card"><div class="mark">YOUR WORKSPACE, ON YOUR DESKTOP</div><h1>Roamgate Desktop</h1><p id="status">Starting your workspace...</p><p id="detail">Herdr runs in the background. Your agents keep working when you close this window.</p><button id="retry" hidden>Try again</button><button id="logs">Open logs</button><p><small>Close to tray · Open from the tray at any time</small></p></main><script src="startup.js"></script></body>
</html>
